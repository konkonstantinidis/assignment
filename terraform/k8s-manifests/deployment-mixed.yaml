apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-mixed
  labels:
    app: app-mixed
spec:
  replicas: 4
  selector:
    matchLabels:
      app: app-mixed
  template:
    metadata:
      labels:
        app: app-mixed
    spec:
      # No nodeSelector or architecture preference
      # Karpenter will automatically choose the best instance type
      # based on available capacity and cost optimization

      # Pod anti-affinity for better distribution
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - app-mixed
              topologyKey: kubernetes.io/hostname

      containers:
      - name: app
        # Using multi-arch image that works on both amd64 and arm64
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: app-mixed
spec:
  selector:
    app: app-mixed
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
