apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-spot
  labels:
    app: app-spot
spec:
  replicas: 5
  selector:
    matchLabels:
      app: app-spot
  template:
    metadata:
      labels:
        app: app-spot
    spec:
      # Node selector to prefer spot instances
      # Karpenter's spot NodePool has higher weight (80) so it will be preferred
      nodeSelector:
        workload-type: spot

      # Topology spread constraints for better availability
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: app-spot

      containers:
      - name: app
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi

        # Readiness probe to ensure graceful handling of spot interruptions
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: app-spot
spec:
  selector:
    app: app-spot
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
